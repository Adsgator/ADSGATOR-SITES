<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adsgator</title>
  <meta name="description" content="Adsgator — agência de tráfego pago e criação de sites.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐊</text></svg>">
  <style>
    :root {
      --bg: #0b0f14;
      --fg: #e8edf4;
      --muted: #8b98a8;
      --accent: #37d67a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.5;
      text-align: center;
    }
    main { max-width: 34rem; }
    .mark {
      font-size: clamp(2rem, 8vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 0.75rem;
    }
    .mark span { color: var(--accent); }
    p { margin: 0; color: var(--muted); }
    .status {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.35rem 0.85rem;
      border: 1px solid #1e2937;
      border-radius: 999px;
      font-size: 0.8125rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1 class="mark">Adsgator<span>.</span></h1>
    <p>Infraestrutura de sites da agência.</p>
    <span class="status">Ambiente no ar</span>
  </main>
</body>
</html>
